name: Publish Crest Alpine Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Install Dependencies
        run: |
          apk update
          apk add --no-cache bash abuild openssl git

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Signing Key & Generate Repository Index
        env:
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          REQUIRE_SIGNING: "1"
        run: |
          if [ -n "$APK_PRIVATE_KEY" ]; then
            echo "==> Importing production APK signing key..."
            mkdir -p keys
            echo "$APK_PRIVATE_KEY" > keys/crest@crestcode.rsa
            chmod 600 keys/crest@crestcode.rsa
          else
            echo "::warning::APK_PRIVATE_KEY secret is not set! Using repository local key if available."
          fi

          echo "==> Running index generation..."
          chmod +x scripts/generate-apk-repo.sh
          ./scripts/generate-apk-repo.sh

          # Ensure private key is deleted before deployment
          rm -f keys/crest@crestcode.rsa

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
